<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
<style>
  .card { animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  .bar { transform-box: fill-box; transform-origin: left; animation: load 3s ease-in-out infinite; }
  @keyframes load { 0% { transform: scaleX(.05) } 70%,100% { transform: scaleX(1) } }
  .emo { font: 34px 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif; }
  .name { font: 800 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0efec; }
  .desc { font: 400 13.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9fb3c8; }
</style>

  <g class="card" style="animation-delay:0.0s">
    <rect x="15" y="15" width="280" height="160" rx="16" fill="#16263f" stroke="#2a78d6" stroke-width="2"/>
    <rect x="15" y="15" width="280" height="8" rx="4" fill="#2a78d6"/>
    <text x="39" y="72" class="emo">🐢</text>
    <text x="91" y="70" class="name">Greedy</text>
    <text x="39" y="112" class="desc">builds the motif one sequence at a time,</text>
    <text x="39" y="134" class="desc">always taking the best-looking k-mer</text>
    <rect x="39" y="152" width="232" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
    <rect x="39" y="152" width="232" height="6" rx="3" fill="#2a78d6" class="bar"
          style="animation-delay:0.0s"/>
  </g>
  <g class="card" style="animation-delay:0.5s">
    <rect x="310" y="15" width="280" height="160" rx="16" fill="#16263f" stroke="#eb6834" stroke-width="2"/>
    <rect x="310" y="15" width="280" height="8" rx="4" fill="#eb6834"/>
    <text x="334" y="72" class="emo">🎲</text>
    <text x="386" y="70" class="name">Randomized</text>
    <text x="334" y="112" class="desc">random start, then improve until stuck;</text>
    <text x="334" y="134" class="desc">restart many times, keep the best</text>
    <rect x="334" y="152" width="232" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
    <rect x="334" y="152" width="232" height="6" rx="3" fill="#eb6834" class="bar"
          style="animation-delay:0.5s"/>
  </g>
  <g class="card" style="animation-delay:1.0s">
    <rect x="605" y="15" width="280" height="160" rx="16" fill="#16263f" stroke="#1baf7a" stroke-width="2"/>
    <rect x="605" y="15" width="280" height="8" rx="4" fill="#1baf7a"/>
    <text x="629" y="72" class="emo">🎰</text>
    <text x="681" y="70" class="name">Gibbs</text>
    <text x="629" y="112" class="desc">re-roll ONE sequence's site at a time,</text>
    <text x="629" y="134" class="desc">weighted by how well it fits</text>
    <rect x="629" y="152" width="232" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
    <rect x="629" y="152" width="232" height="6" rx="3" fill="#1baf7a" class="bar"
          style="animation-delay:1.0s"/>
  </g>
</svg>
